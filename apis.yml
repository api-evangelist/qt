name: Qt
description: >-
  Qt Group is a global software company that builds cross-platform development,
  design, and quality-assurance tools used across more than 70 industries and
  billions of devices. Its portfolio spans the Qt Framework (cross-platform C++
  software libraries and APIs), the Qt Creator IDE, Qt for MCUs, Qt Design
  Studio, and the quality-assurance suite (Squish GUI test automation, Coco code
  coverage, Test Center, and Axivion static analysis). Qt does not publish a
  public REST/HTTP API; its "APIs" are C++/QML/Python library APIs shipped with
  the framework, with the official Python bindings (PySide6/PySide2) distributed
  on PyPI. Documentation, learning, and support are provided through doc.qt.io,
  the Qt Academy, and forum.qt.io.
